server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Unikt Compose-alias (ikke "api") — undgår DNS-kollision med andre Dokploy-apps
    location /api/ {
        proxy_pass http://fremtidsbarometer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-api-key $http_x_api_key;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Vite build assets (CSS, JS) — explicit MIME types and long-lived cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static assets
    location ~* \.(?:ico|css|js|mjs|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|wasm|json)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA Entrypoint — never cache index.html so updated asset hashes are loaded immediately
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }
}
